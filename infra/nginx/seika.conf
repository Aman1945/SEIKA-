# SEIKA — reverse proxy.
#
# Terminates TLS, forwards to the API, and upgrades the Socket.IO connection
# that the PC kiosks and dashboards live on. Certificates come from certbot:
#
#   certbot certonly --nginx -d api.seika.gg
#
# Nothing here rate-limits money endpoints on purpose — the API does that, and
# it knows the difference between a player and a payment webhook. What nginx
# guards is the shape of a request, which it can judge and the API cannot.

upstream seika_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# A cheap first line for OTP flooding. The API's own limiter is the real one,
# per identifier; this one just stops a single host from reaching it at all.
limit_req_zone $binary_remote_addr zone=seika_otp:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=seika_api:10m rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.seika.gg;

    # Certbot's challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.seika.gg;

    ssl_certificate     /etc/letsencrypt/live/api.seika.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seika.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A migration CSV is the largest legitimate upload; the API caps at 6MB.
    client_max_body_size 8m;
    client_body_timeout 30s;

    access_log /var/log/nginx/seika-access.log;
    error_log  /var/log/nginx/seika-error.log warn;

    # Socket.IO: long-lived, needs the upgrade headers and a long read timeout,
    # or the kiosks reconnect every minute and the PC map flickers.
    location /socket.io/ {
        proxy_pass http://seika_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    location = /api/auth/otp/request {
        limit_req zone=seika_otp burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/seika-proxy.conf;
    }

    # The payment webhook must reach the API even when a burst is in progress:
    # dropping it loses a top-up the player has already been charged for.
    location = /api/payments/webhook {
        include /etc/nginx/snippets/seika-proxy.conf;
    }

    location / {
        limit_req zone=seika_api burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/seika-proxy.conf;
    }

    # Readiness is for the load balancer and the uptime monitor; keep it out of
    # the access log so a 60s poll does not bury real traffic.
    location = /health/ready {
        access_log off;
        include /etc/nginx/snippets/seika-proxy.conf;
    }
}
